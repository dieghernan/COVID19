# Site configuration
remote_theme: dieghernan/chulapa

# Site identity and SEO
locale: es-ES
title: COVID19 en España
subtitle: Archivo de visualizaciones históricas
description: Archivo de mapas y gráficos históricos sobre la COVID-19 en España. Proyecto
  sin actualizaciones.
url: https://dieghernan.github.io
baseurl: "/COVID19"
repository: dieghernan/COVID19
timezone: Europe/Madrid

# Sharing images
og_image: assets/img/header.png
og_image_alt: Mapa de España con municipios representados por puntos rojos sobre fondo
  oscuro.
og_image_width: 850
og_image_height: 429
og_image_type: image/png

# Author and publisher
author:
  name: Diego Hernangómez
  url: https://dieghernan.github.io/
  avatar: https://dieghernan.github.io/assets/img/site/avatar.png
  location: Madrid, España
  links:
  - url: https://x.com/dhernangomez
    icon: fab fa-square-x-twitter
    label: Twitter/X
  - url: https://fosstodon.org/@dhernangomez
    icon: fa-brands fa-mastodon
    label: Mastodon
  - url: https://bsky.app/profile/dieghernan.bsky.social
    icon: fa-brands fa-square-bluesky
    label: Bluesky
  - url: https://github.com/dieghernan/
    icon: fab fa-github
    label: GitHub
  - url: https://stackoverflow.com/users/7877917/dieghernan
    icon: fab fa-stack-overflow
    label: Stack Overflow
  - url: https://orcid.org/0000-0001-8457-4658
    icon: fa-brands fa-orcid
    label: ORCID
publisher:
  type: Person
  name: Diego Hernangómez
  url: https://dieghernan.github.io/
  image: https://dieghernan.github.io/assets/img/site/avatar.png

# Analytics
gtag_id: G-5JHYDPSL0K

# Navigation
navbar:
  expand: always
  brand:
    title: Inicio
  nav:
  - title: Galería
    url: "/Galeria"
  - title: Mi blog
    url: https://dieghernan.github.io/
footer:
  links:
  - label: Stack Overflow
    icon: fab fa-stack-overflow
    url: https://stackoverflow.com/users/7877917/dieghernan
  - label: GitHub
    icon: fab fa-github
    url: https://github.com/dieghernan/
  - label: Blog
    icon: fas fa-blog
    url: https://dieghernan.github.io/
  - label: RPubs
    icon: fab fa-r-project
    url: https://rpubs.com/dieghernan

# Appearance
googlefonts:
- url: https://fonts.googleapis.com/css2?family=Varta&family=Lora&display=swap
chulapa-skin:
  autothemer: true
  vars:
    primary: black
    navbar-chulapa-text-color: white
    font-family-base: Varta, sans-serif
    headings-font-family: Lora, serif
    navbar-chulapa-toggler-color: "#F5F5F5"
    navbar-chulapa-toggler-border-color: transparent

# Content and build settings
defaults:
- scope:
    path: ''
  values:
    layout: default
    header_type: base
    show_sociallinks: true
- scope:
    path: assets/png/Casos
  values:
    image_col: casos
- scope:
    path: assets/png/Contagios
  values:
    image_col: contagios
- scope:
    path: assets/png/Fallecidos
  values:
    image_col: fallecidos
- scope:
    path: assets/png/RatioHosp
  values:
    image_col: hospitalizados
include:
- _pages
compress_html:
  clippings: all
  blanklines: true
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: "&uarr;"
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
incremental: false
exclude:
- README.md
- Gemfile
- vendor
- index.Rmd
- R/
- assets/data/
- LICENSE
- AGENTS.md
- Gemfile.lock
- ".bundle"
plugins:
- jekyll-remote-theme
- jekyll-github-metadata
- jekyll-include-cache
- jekyll-sitemap
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
  - global-builtin
  - color-functions
  - abs-percent
  - function-units
  - if-function

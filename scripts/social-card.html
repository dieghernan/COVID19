<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COVID19 en España — imagen social</title>
  <style>
    @font-face { font-family: Varta; src: url('./assets/fonts/Varta.ttf'); font-weight: 300 700; }
    @font-face { font-family: Lora; src: url('./assets/fonts/Lora.ttf'); font-weight: 400 700; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #000; color: #fff; font-family: Varta, sans-serif; }
    .map { position: absolute; inset: 0 0 0 34%; overflow: hidden; }
    .map img { width: 100%; height: 100%; object-fit: cover; object-position: 58% center; }
    .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #000 0%, #000 34%, #000d 44%, #0000 73%); }
    main { position: absolute; inset: 10.3% 5%; }
    .tag { color: #ccc; font-size: 1.7vw; font-weight: 700; }
    h1 { margin: 4.2vw 0 0; font: 700 6.7vw/1.15 Lora, serif; letter-spacing: -.18vw; }
    .description { margin: 3.8vw 0 0; color: #ddd; font-size: 2.35vw; line-height: 1.4; }
    footer { position: absolute; bottom: 0; font-size: 1.7vw; }
    .credit { position: absolute; bottom: 3%; right: 3%; background: #000e; color: #ddd; padding: .6em .9em; font-size: 1.1vw; }
  </style>
</head>
<body>
  <div class="map"><img src="../assets/img/header.png" alt="Mapa de municipios de España"></div>
  <div class="fade"></div>
  <main>
    <div class="tag">ARCHIVO · ABRIL DE 2020</div>
    <h1>COVID-19<br>en España</h1>
    <p class="description">Mapas y gráficos históricos.<br>Proyecto sin actualizaciones.</p>
    <footer>Una mirada a los datos de abril de 2020.</footer>
  </main>
  <div class="credit">Municipios de España · dieghernan</div>
</body>
</html>
